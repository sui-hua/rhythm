<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rhythm 移动端高保真原型</title>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace']
          },
          boxShadow: {
            'card': '0 2px 10px -2px rgba(0, 0, 0, 0.03), 0 1px 3px 0 rgba(0, 0, 0, 0.02)',
            'card-hover': '0 6px 18px -4px rgba(0, 0, 0, 0.06), 0 2px 6px 0 rgba(0, 0, 0, 0.03)',
            'fab': '0 12px 28px -4px rgba(24, 24, 27, 0.35), 0 4px 10px -2px rgba(24, 24, 27, 0.15)'
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .ios-scroll { -webkit-overflow-scrolling: touch; }
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .toast-enter-active, .toast-leave-active { transition: all 0.25s ease; }
    .toast-enter-from, .toast-leave-to { opacity: 0; transform: translate(-50%, -10px); }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-900 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-0 md:p-6 select-none">

<div id="app" class="w-full h-full flex flex-col items-center">

  <!-- 外部辅助工具条（桌面预览辅助） -->
  <header class="hidden md:flex items-center justify-between w-full max-w-[390px] mb-3 px-3 text-zinc-400 text-xs">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-zinc-900"></span>
      <span class="font-medium text-zinc-800 tracking-tight">Rhythm Mobile</span>
    </div>
    <div class="flex items-center gap-3">
      <button @click="resetSampleData" class="hover:text-zinc-900 transition-colors font-medium">重置数据</button>
      <span>•</span>
      <button @click="togglePhoneFrame" class="hover:text-zinc-900 transition-colors font-medium">
        {{ showFrame ? '全屏查看' : '机壳查看' }}
      </button>
    </div>
  </header>

  <!-- 手机视口容器：高级微灰画布背景 (#f4f4f7) -->
  <main
    :class="[
      'w-full max-w-[390px] h-[100dvh] md:h-[844px] bg-[#f4f4f7] relative flex flex-col overflow-hidden transition-all duration-300',
      showFrame ? 'md:rounded-[48px] md:shadow-[0_25px_65px_-12px_rgba(0,0,0,0.18)] md:border-[10px] md:border-zinc-900 ring-1 ring-zinc-800/20' : 'md:rounded-none'
    ]"
  >
    <!-- 统一组件化复用吸顶导航栏 (AppHeader) -->
    <app-header
      :time="currentHourTime"
      :title="currentHeaderConfig.title"
      :subtitle="currentHeaderConfig.subtitle"
    >
      <!-- 左侧自定义标题插槽（时序 Tab 特色日期选择） -->
      <template v-if="currentTab === 'day'" #title>
        <button
          @click="openDatePicker"
          class="group flex items-center gap-1.5 text-left text-zinc-900 active:scale-[0.98] transition-all select-none"
          title="点击选择日期"
        >
          <h1 class="text-[22px] font-bold tracking-tight font-sans group-hover:text-zinc-600 transition-colors">
            {{ selectedDateLine }}
          </h1>
          <div class="w-5 h-5 rounded-full flex items-center justify-center text-zinc-400 group-hover:text-zinc-800 group-hover:bg-zinc-100 transition-all">
            <lucide-icon name="chevron-down" :size="13" :stroke-width="2.5"></lucide-icon>
          </div>
          <span
            v-if="!isToday"
            @click.stop="onSelectToday"
            class="text-[10px] font-mono font-semibold text-zinc-600 bg-zinc-100 hover:bg-zinc-200 px-2 py-0.5 rounded-full transition-colors active:scale-95 ml-0.5"
            title="点击直接返回今天"
          >
            今
          </span>
        </button>
      </template>

      <!-- 右侧自定义微控插槽 (#right) -->
      <template #right>
        <!-- 时序 Tab：微型环形进度 -->
        <div
          v-if="currentTab === 'day'"
          class="relative w-7 h-7 flex items-center justify-center shrink-0 cursor-default"
          :title="'今日进度：' + completedTasksCount + '/' + currentTasks.length"
        >
          <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="14" stroke="#e4e4e7" stroke-width="2.8" fill="none" />
            <circle
              cx="18"
              cy="18"
              r="14"
              stroke="#18181b"
              stroke-width="2.8"
              fill="none"
              stroke-linecap="round"
              stroke-dasharray="88"
              :stroke-dashoffset="taskRingOffset"
              class="transition-all duration-500 ease-out"
            />
          </svg>
        </div>

        <!-- 习惯 Tab：已打卡微胶囊 -->
        <span
          v-else-if="currentTab === 'habits'"
          class="text-[11px] font-mono font-medium px-2.5 py-1 rounded-full bg-zinc-100 text-zinc-600"
        >
          已打卡 {{ completedHabitsCount }} / {{ habits.length }}
        </span>

        <!-- 所向 Tab：里程碑计数微胶囊 -->
        <span
          v-else-if="currentTab === 'direction'"
          class="text-[11px] font-mono font-medium px-2.5 py-1 rounded-full bg-zinc-100 text-zinc-600"
        >
          {{ goals.length }} 个里程碑
        </span>

        <!-- 总结 Tab：分段切换胶囊 -->
        <div
          v-else-if="currentTab === 'summary'"
          class="flex bg-zinc-100 p-0.5 rounded-full text-xs font-semibold"
        >
          <button
            v-for="t in ['日', '周', '月', '年']"
            :key="t"
            @click="activePeriod = t"
            :class="activePeriod === t ? 'bg-white text-zinc-900 shadow-xs rounded-full px-2.5 py-0.5' : 'text-zinc-500 hover:text-zinc-900 px-2.5 py-0.5'"
          >
            {{ t }}
          </button>
        </div>
      </template>
    </app-header>

    <!-- 滚动内容区 -->
    <div class="flex-1 overflow-y-auto no-scrollbar ios-scroll relative pb-32">
      <!-- 页面 1：时序 (Day) -->
      <day-view
        v-if="currentTab === 'day'"
        :tasks="currentTasks"
        @toggle-task="onToggleTask"
        @edit-task="onEditTask"
        @add-task="onAddTask"
      ></day-view>

      <!-- 页面 2：习惯 (Habits) -->
      <habits-view
        v-else-if="currentTab === 'habits'"
        :habits="habits"
        @toggle-habit="onToggleHabit"
      ></habits-view>

      <!-- 页面 3：所向 (Direction) -->
      <direction-view
        v-else-if="currentTab === 'direction'"
        :goals="goals"
        @click-goal="onClickGoal"
      ></direction-view>

      <!-- 页面 4：总结 (Summary) -->
      <summary-view
        v-else-if="currentTab === 'summary'"
        :summaries="currentSummaries"
      ></summary-view>
    </div>

    <!-- 弥散柔光悬浮操作按钮 (FAB) -->
    <button
      @click="handleFabClick"
      class="absolute bottom-[78px] right-6 w-12 h-12 rounded-full bg-zinc-900 text-white shadow-fab hover:scale-105 active:scale-95 transition-all duration-200 flex items-center justify-center z-40"
      title="新建"
    >
      <lucide-icon name="plus" :size="20" stroke-width="2.5"></lucide-icon>
    </button>

    <!-- 原生毛玻璃底部 TabBar -->
    <tab-bar
      :current-tab="currentTab"
      :items="navItems"
      @update:current-tab="currentTab = $event"
    ></tab-bar>

    <!-- 日期选择器抽屉 -->
    <date-picker-drawer
      v-model:show="showDatePicker"
      :current-date-obj="currentDateObj"
      :tasks-by-date="tasksByDate"
      :is-today="isToday"
      @select-date="onSelectCalendarDate"
      @select-today="onSelectToday"
    ></date-picker-drawer>

    <!-- 事项模态弹窗 (新增/编辑) -->
    <task-modal
      v-model:show="showTaskModal"
      :task="editingTask"
      @save="onSaveTask"
      @delete="onDeleteTask"
    ></task-modal>

    <!-- 新建习惯弹窗 -->
    <habit-modal
      v-model:show="showHabitModal"
      @save="onSaveHabit"
    ></habit-modal>

    <!-- 新建复盘反思弹窗 -->
    <summary-modal
      v-model:show="showSummaryModal"
      :period="activePeriod"
      @save="onSaveSummary"
    ></summary-modal>

    <!-- 轻量优雅 Toast 提示 -->
    <transition name="toast">
      <div v-if="toastMessage" class="fixed top-12 left-1/2 -translate-x-1/2 z-50 bg-zinc-900/90 backdrop-blur-md text-white text-xs font-medium px-4 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 pointer-events-none">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        {{ toastMessage }}
      </div>
    </transition>

  </main>
</div>

<!-- ======================================================== -->
<!-- 模块化脚本按依赖顺序加载 (完全兼容 file:/// 本地双击秒开) -->
<!-- ======================================================== -->
<!-- 1. 数据与图标定义 -->
<script src="js/icons.js"></script>
<script src="js/mockData.js"></script>

<!-- 2. UI 组件群 -->
<script src="js/components/LucideIcon.js"></script>
<script src="js/components/AppHeader.js"></script>
<script src="js/components/TabBar.js"></script>
<script src="js/components/DayView.js"></script>
<script src="js/components/HabitsView.js"></script>
<script src="js/components/DirectionView.js"></script>
<script src="js/components/SummaryView.js"></script>
<script src="js/components/DatePickerDrawer.js"></script>
<script src="js/components/Modals.js"></script>

<!-- 3. 应用主装配与逻辑挂载 -->
<script src="js/app.js"></script>

</body>
</html>
