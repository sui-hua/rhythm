services:
  postgres:
    image: postgres:17-alpine
    container_name: postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 'RainFlower@2004.'
      POSTGRES_DB: rhythm
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - /data/postgresql/data:/var/lib/postgresql/data